services:
  web:
    build:
      context: .
    container_name: fashion-marketplace-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://marketplace:marketplace@postgres:5432/marketplace?schema=public
      SESSION_SECRET: docker-dev-secret-change-before-production
      APP_URL: http://localhost:3000
      COMMISSION_RATE: "0.10"
      FLAT_SHIPPING_FEE_THB: "50"
      SEED_DATABASE: "true"
    ports:
      - "3000:3000"

  postgres:
    image: postgres:16-alpine
    container_name: fashion-marketplace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: marketplace
      POSTGRES_DB: marketplace
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketplace -d marketplace"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
